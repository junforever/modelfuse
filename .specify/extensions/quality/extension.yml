schema_version: '1.0'

extension:
  id: 'quality'
  name: 'Quality Gate'
  version: '1.2.0'
  description: 'Valida y mejora la calidad del código: formato, lint, typecheck, análisis retrospectivo de flujo.'
  author: 'junforever'
  repository: 'https://github.com/junforever/speckit-extensions/quality'
  license: 'MIT'

requires:
  speckit_version: '>=0.2.0'
  tools:
    - name: node
      required: false
      version: '>=22.0.0'

provides:
  commands:
    - name: 'speckit.quality.format'
      file: 'commands/speckit.quality.format.md'
      description: 'Formatea el código fuente usando Prettier, una única vez al finalizar todas las tareas.'

  config:
    - name: 'quality-config.yml'
      template: 'quality-config.template.yml'
      description: 'Configuración de los quality gates.'
      required: false

hooks:
  after_implement:
    command: 'speckit.quality.format'
    optional: false
    description: 'Formatear con Prettier UNA sola vez, después de que TODAS las tareas del implement hayan finalizado.'

tags:
  - 'quality'
  - 'prettier'
  - 'formatter'
  - 'code-quality'

config:
  defaults:
    format_enabled: true
    format_tool: 'prettier'
    # lint_enabled: false
    # typecheck_enabled: false
    # test_enabled: false
