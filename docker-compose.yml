services:
  postgres_modelfuse:
    image: postgres:16-alpine
    container_name: postgres_modelfuse_dev
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-db_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_modelfuse_data:/var/lib/postgresql/data
    networks:
      - modelfuse_network_dev

  pgadmin_modelfuse:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_modelfuse_dev
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    ports:
      - "8080:80"
    depends_on:
      postgres_modelfuse:
        condition: service_healthy
    networks:
      - modelfuse_network_dev
    volumes:
      - pgadmin_modelfuse_data:/var/lib/pgadmin

  liquibase_modelfuse:
    image: liquibase/liquibase:4.30.0
    container_name: liquibase_modelfuse_dev
    env_file:
      - ./apps/backend/.env
    volumes:
      - ./db/changelogs:/liquibase/changelog
    command:
      - --url=jdbc:postgresql://postgres_modelfuse:5432/${POSTGRES_DB:-db_dev}
      - --search-path=/liquibase/changelog
      - --changelog-file=db.changelog-master.xml
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:-postgres}
      - update
    # This is a one-shot migration job; readiness is its successful exit, not a long-lived healthcheck.
    restart: "no"
    depends_on:
      postgres_modelfuse:
        condition: service_healthy
    networks:
      - modelfuse_network_dev

volumes:
  postgres_modelfuse_data:
  pgadmin_modelfuse_data:

networks:
  modelfuse_network_dev:
    driver: bridge
