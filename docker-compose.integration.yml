services:
  postgres_integration:
    image: postgres:16-alpine
    env_file:
      - ${MODELFUSE_TEST_ENV_FILE:?MODELFUSE_TEST_ENV_FILE is required}
    environment:
      POSTGRES_DB: ${MODELFUSE_TEST_DATABASE_NAME:?MODELFUSE_TEST_DATABASE_NAME is required}
      POSTGRES_USER: ${MODELFUSE_TEST_DATABASE_USER:?MODELFUSE_TEST_DATABASE_USER is required}
      POSTGRES_PASSWORD: ${MODELFUSE_TEST_DATABASE_PASSWORD:?MODELFUSE_TEST_DATABASE_PASSWORD is required}
    ports:
      - "${MODELFUSE_TEST_DB_PORT:?MODELFUSE_TEST_DB_PORT is required}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  liquibase_integration:
    image: liquibase/liquibase:4.30.0
    env_file:
      - ${MODELFUSE_TEST_ENV_FILE:?MODELFUSE_TEST_ENV_FILE is required}
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres_integration:5432/${MODELFUSE_TEST_DATABASE_NAME:?MODELFUSE_TEST_DATABASE_NAME is required}
      LIQUIBASE_COMMAND_USERNAME: ${MODELFUSE_TEST_DATABASE_USER:?MODELFUSE_TEST_DATABASE_USER is required}
      LIQUIBASE_COMMAND_PASSWORD: ${MODELFUSE_TEST_DATABASE_PASSWORD:?MODELFUSE_TEST_DATABASE_PASSWORD is required}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    volumes:
      - ./db/changelogs:/liquibase/changelog:ro
    command: ["update"]
    restart: "no"
    depends_on:
      postgres_integration:
        condition: service_healthy
